<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Risemock</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation: fadeIn 1.5s ease-in;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        h2 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 1rem;
            transition: opacity 0.5s ease;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 10px;
            margin-bottom: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
.validation-message {
    font-size: 12px;
    color: red;
    margin-top: -0.5rem;
    margin-bottom: 0.5rem;
}
select {
    padding: 10px;
    margin-bottom: 1rem;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
}
        button {
            background: #4f46e5;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #4338ca;
        }

        .message {
            margin-top: 10px;
            font-size: 14px;
            color: red;
            text-align: center;
        }

        .small-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 13px;
        }

        .small-text a {
            color: #4f46e5;
            text-decoration: none;
        }

        svg {
            position: absolute;
            top: -60px;
            right: -60px;
            width: 120px;
            opacity: 0.2;
        }
.field-msg {
    font-size: 12px;
    color: red;
    margin-bottom: 0.5rem;
}

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 id="headline">Join us today</h2>
    <form id="signupForm">
        <input type="text" id="username" placeholder="Username" required />
        <div class="validation-message" id="usernameMsg"></div>
    
        <input type="email" id="email" placeholder="Email" required />
        <div class="validation-message" id="emailMsg"></div>
    
        <input type="password" id="password" placeholder="Password" required />
        <div class="validation-message" id="passwordMsg"></div>
    
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
        <div class="validation-message" id="confirmPasswordMsg"></div>
    
        <!-- Grade selector -->
        <select id="grade" required>
            <option value="">Select your grade</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
        <div class="validation-message" id="gradeMsg"></div>
    
        <button type="submit">Create Account</button>
        <div class="message" id="message"></div>
    </form>

        <div class="small-text">
            Already have an account? <a href="login.html">Log in here</a>
        </div>
        <svg viewBox="0 0 512 512" fill="#4f46e5">
            <path
                d="M256 0C114.836 0 0 114.836 0 256s114.836 256 256 256 256-114.836 256-256S397.164 0 256 0zm0 470.857C132.192 470.857 41.143 379.808 41.143 256S132.192 41.143 256 41.143 470.857 132.192 470.857 256 379.808 470.857 256 470.857z" />
        </svg>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
        // Animated heading text change
        const headline = document.getElementById("headline");
        setTimeout(() => {
            headline.textContent = "Start your journey";
        }, 5000);

        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");


          
            // --- live feedback elements ---
            const usernameMsg = document.getElementById("usernameMsg");
            const emailMsg = document.getElementById("emailMsg");
            const passwordMsg = document.getElementById("passwordMsg");
            const confirmPasswordMsg = document.getElementById("confirmPasswordMsg");
            const gradeMsg = document.getElementById("gradeMsg");

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const username = document.getElementById("username").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const grade = document.getElementById("grade").value;
               
                // ---  check passwords match ---
                if (password !== confirmPassword) {
                    message.textContent = "Passwords do not match!";
                    message.style.color = "red";
                    return; // stop form submission
                }
                const response = await fetch("http://localhost:5000/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email, password, grade }),
                });

                let valid = true;

                // Username
                if (!validateUsername(username)) {
                    usernameMsg.textContent = "Letters and numbers only.";
                    valid = false;
                } else {
                    usernameMsg.textContent = "";
                }

                // Email
                if (!email.includes("@") || !email.includes(".")) {
                    emailMsg.textContent = "Enter a valid email.";
                    valid = false;
                } else {
                    emailMsg.textContent = "";
                }

                // Password
                if (!validatePassword(password)) {
                    passwordMsg.textContent = "Letters and numbers only.";
                    valid = false;
                } else {
                    passwordMsg.textContent = "";
                }

                // Confirm password
                if (password !== confirmPassword) {
                    confirmPasswordMsg.textContent = "Passwords do not match.";
                    valid = false;
                } else {
                    confirmPasswordMsg.textContent = "";
                }

                // Grade
                if (!["9", "10", "11", "12"].includes(grade)) {
                    gradeMsg.textContent = "Please select a grade.";
                    valid = false;
                } else {
                    gradeMsg.textContent = "";
                }
                // --- validation functions ---
                function validateUsername(username) {
                    const regex = /^[a-zA-Z0-9]+$/;
                    return regex.test(username);
                }

                function validatePassword(password) {
                    const regex = /^[A-Za-z0-9]+$/; // only letters and numbers, no special chars
                    return regex.test(password);
                }

                if (!valid) return; // stop submission if any errors

                // --- backend fetch ---
                try {
                    const response = await fetch("http://localhost:5000/signup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, email, password, grade }),
                    });

                    const data = await response.json();

                    if (response.ok) {
                        message.textContent = "Account created successfully! Redirecting to login…";
                        message.style.color = "green";
                        setTimeout(() => { window.location.href = "login.html"; }, 800);
                    } else {
                        message.textContent = data.message || "Signup failed.";
                        message.style.color = "red";
                    }
                } catch (err) {
                    console.error(err);
                    message.textContent = "Could not reach the server. Is it running on http://localhost:5000?";
                    message.style.color = "red";
                }
                 // call backend
                try {
                    const response = await fetch("http://localhost:5000/signup", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, email, password }),
                    });

                    const data = await response.json();
                      if (response.ok) {
                        message.textContent = "Account created successfully! Redirecting to login…";
                        message.style.color = "green";
                        setTimeout(() => { window.location.href = "login.html"; }, 800);
                    } else {
                        message.textContent = data.message || "Signup failed.";
                        message.style.color = "red";
                    }
                } catch (err) {
                    console.error(err);
                    message.textContent = "Could not reach the server. Is it running on http://localhost:5000?";
                    message.style.color = "red";
                }

            });
               
                  
        });
    </script>
    

</body>

</html>
